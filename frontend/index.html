<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Contractor Registration – CTP Payment Demo</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- React via CDN for a simple demo setup -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script crossorigin src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
    <style>
      * {
        box-sizing: border-box;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
      }
      body {
        margin: 0;
        background: #0f172a;
        color: #e5e7eb;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
      }
      .app-shell {
        width: 100%;
        max-width: 960px;
        padding: 32px;
      }
      .card {
        background: #020617;
        border-radius: 16px;
        padding: 24px 28px;
        box-shadow: 0 20px 40px rgba(15, 23, 42, 0.75);
        border: 1px solid #1f2937;
      }
      h1 {
        font-size: 1.6rem;
        margin-bottom: 4px;
      }
      h2 {
        font-size: 1.1rem;
        margin-top: 24px;
        margin-bottom: 12px;
      }
      .subtitle {
        font-size: 0.9rem;
        color: #9ca3af;
        margin-bottom: 20px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 16px;
      }
      label {
        display: block;
        font-size: 0.8rem;
        color: #9ca3af;
        margin-bottom: 4px;
      }
      input,
      select {
        width: 100%;
        padding: 8px 10px;
        border-radius: 8px;
        border: 1px solid #374151;
        background: #020617;
        color: #e5e7eb;
        font-size: 0.9rem;
      }
      input:focus,
      select:focus {
        outline: 2px solid #3b82f6;
        border-color: transparent;
      }
      .btn-row {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 20px;
      }
      .btn {
        border-radius: 999px;
        padding: 9px 18px;
        font-size: 0.9rem;
        border: none;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 8px;
      }
      .btn-primary {
        background: linear-gradient(135deg, #3b82f6, #22c55e);
        color: #0b1120;
        font-weight: 600;
      }
      .btn-secondary {
        background: #111827;
        color: #e5e7eb;
        border: 1px solid #374151;
      }
      .btn:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }
      .status-pill {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        border-radius: 999px;
        padding: 4px 10px;
        font-size: 0.78rem;
        background: #020617;
        border: 1px solid #1f2937;
        color: #9ca3af;
      }
      .status-pill span.dot {
        width: 8px;
        height: 8px;
        border-radius: 999px;
      }
      .dot-pending {
        background: #facc15;
      }
      .dot-success {
        background: #22c55e;
      }
      .dot-failed {
        background: #ef4444;
      }
      .log {
        margin-top: 16px;
        padding: 12px 14px;
        border-radius: 10px;
        background: #020617;
        border: 1px solid #111827;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas,
          "Liberation Mono", "Courier New", monospace;
        font-size: 0.8rem;
        max-height: 220px;
        overflow: auto;
        white-space: pre-wrap;
      }
      .helper {
        font-size: 0.78rem;
        color: #6b7280;
        margin-top: 6px;
      }
      @media (max-width: 640px) {
        .app-shell {
          padding: 16px;
        }
        .card {
          padding: 18px 16px;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script type="text/babel">
      const { useState } = React;

      const API_BASE = "http://localhost:4000/api";

      function StatusPill({ status }) {
        if (!status) return null;
        const normalized = status.toUpperCase();
        const statusClass =
          normalized === "SUCCESS"
            ? "dot-success"
            : normalized === "FAILED"
            ? "dot-failed"
            : "dot-pending";
        return (
          <div className="status-pill">
            <span className={"dot " + statusClass} />
            <span>{normalized}</span>
          </div>
        );
      }

      function App() {
        const [form, setForm] = useState({
          contractorName: "",
          email: "",
          amount: "",
          workType: "Road Cutting"
        });
        const [transactionId, setTransactionId] = useState("");
        const [status, setStatus] = useState("");
        const [loadingInitiate, setLoadingInitiate] = useState(false);
        const [loadingStatus, setLoadingStatus] = useState(false);
        const [log, setLog] = useState(
          "// Logs will appear here as you interact with the gateway demo."
        );

        const appendLog = (line) => {
          setLog((prev) => prev + "\\n" + line);
        };

        const handleChange = (e) => {
          const { name, value } = e.target;
          setForm((prev) => ({ ...prev, [name]: value }));
        };

        const initiatePayment = async (e) => {
          e.preventDefault();
          setStatus("");
          setLoadingInitiate(true);
          try {
            appendLog(
              "Initiating CTP payment for " +
                form.contractorName +
                " amount " +
                form.amount
            );
            const res = await fetch(API_BASE + "/payments/initiate", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                contractorName: form.contractorName,
                email: form.email,
                amount: Number(form.amount),
                workType: form.workType
              })
            });
            const data = await res.json();
            appendLog("Response: " + JSON.stringify(data, null, 2));
            if (!data.success) {
              alert(data.message || "Failed to initiate payment");
              return;
            }
            setTransactionId(data.transactionId);
            setStatus("PENDING");
            if (data.redirectUrl) {
              // In real life, you either redirect the browser or open in a new tab
              window.open(data.redirectUrl, "_blank");
            }
          } catch (err) {
            console.error(err);
            appendLog("Error: " + err.message);
            alert("Error initiating payment (check console and backend).");
          } finally {
            setLoadingInitiate(false);
          }
        };

        const checkStatus = async () => {
          if (!transactionId) {
            alert("No transactionId yet. Initiate a payment first.");
            return;
          }
          setLoadingStatus(true);
          try {
            appendLog("Checking status for " + transactionId);
            const res = await fetch(
              API_BASE + "/payments/status/" + transactionId
            );
            const data = await res.json();
            appendLog("Status response: " + JSON.stringify(data, null, 2));
            if (!data.success) {
              alert(data.message || "Failed to get status");
              return;
            }
            setStatus(data.status);
          } catch (err) {
            console.error(err);
            appendLog("Error: " + err.message);
            alert("Error checking status (check console and backend).");
          } finally {
            setLoadingStatus(false);
          }
        };

        return (
          <div className="app-shell">
            <div className="card">
              <h1>Contractor Registration – CTP Payment Demo</h1>
              <div className="subtitle">
                This is a **dummy** integration against a fake CTP payment
                gateway. Replace the API URLs and payloads with the real
                endpoints from the CTP documents.
              </div>

              <h2>Contractor details</h2>
              <form onSubmit={initiatePayment}>
                <div className="grid">
                  <div>
                    <label>Contractor name</label>
                    <input
                      name="contractorName"
                      value={form.contractorName}
                      onChange={handleChange}
                      placeholder="ABC Infra Pvt Ltd"
                      required
                    />
                  </div>
                  <div>
                    <label>Contact email</label>
                    <input
                      type="email"
                      name="email"
                      value={form.email}
                      onChange={handleChange}
                      placeholder="contact@contractor.com"
                      required
                    />
                  </div>
                  <div>
                    <label>Work type</label>
                    <select
                      name="workType"
                      value={form.workType}
                      onChange={handleChange}
                    >
                      <option>Road Cutting</option>
                      <option>ROW Permit</option>
                      <option>Other Works</option>
                    </select>
                  </div>
                  <div>
                    <label>Amount (INR)</label>
                    <input
                      type="number"
                      min="1"
                      step="0.01"
                      name="amount"
                      value={form.amount}
                      onChange={handleChange}
                      placeholder="1500"
                      required
                    />
                  </div>
                </div>

                <div className="btn-row">
                  <button
                    className="btn btn-primary"
                    type="submit"
                    disabled={loadingInitiate}
                  >
                    {loadingInitiate ? "Creating CTP payment..." : "Pay via CTP"}
                  </button>

                  <button
                    type="button"
                    className="btn btn-secondary"
                    onClick={checkStatus}
                    disabled={loadingStatus}
                  >
                    {loadingStatus ? "Checking status..." : "Check Payment Status"}
                  </button>

                  <div style={{ flexGrow: 1 }} />

                  <StatusPill status={status} />
                </div>
              </form>

              <div className="helper">
                After you map the real CTP API, this form would be part of your
                `Contractor Registration` product and the payment status would
                drive the registration workflow.
              </div>

              <h2>Debug log</h2>
              <div className="log">{log}</div>
            </div>
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
